<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grams to Kilograms Converter</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        input[type="number"] {
            padding: 5px;
            width: 100%;
        }
        button {
            padding: 10px;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <h1>Grams to Kilograms Converter</h1>
    <form>
        <label for="grams">Enter grams:</label>
        <input type="number" id="grams" name="grams" value="0">
        <button type="button" onclick="convertToKilograms()">Convert</button>
    </form>
    <div id="result"></div>

    <script>
        function convertToKilograms() {
            const grams = parseInt(document.getElementById('grams').value);
            if (isNaN(grams) || grams <= 0) {
                document.getElementById('result').textContent = "Please enter a valid positive number.";
                return;
            }

            const kilograms = grams / 1000; // Convert grams to kilograms
            document.getElementById('result').textContent = `${grams} grams = ${kilograms.toFixed(2)} kilograms`;
        }
    </script>
</body>
</html>
